name: Iterum Therapeutics
description: Iterum Therapeutics plc is a clinical-stage pharmaceutical company headquartered
  in Dublin, Ireland, focused on developing novel anti-infective medications to treat multi-drug
  resistant (MDR) bacterial infections. Its lead product, ORLYNVAH (sulopenem), is described as
  the first oral and IV penem antibiotic targeting gram-negative resistant infections. The company
  was surfaced as a portfolio company of canaan-partners and added to the API Evangelist network.
  Iterum Therapeutics is a pharmaceutical/biotech company and does not operate a public developer
  API; as of March 2026 the company entered liquidation following a High Court order in Ireland.
